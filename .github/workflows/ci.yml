name: CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Domain tests and simulator builds
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run domain tests
        run: swift test

      - name: Build iPhone app and UI tests
        run: |
          xcodebuild -project Raydiun.xcodeproj -scheme Raydiun \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData/iOS CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: Build Watch app
        run: |
          xcodebuild -project Raydiun.xcodeproj -scheme RaydiunWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath DerivedData/Watch CODE_SIGNING_ALLOWED=NO build
